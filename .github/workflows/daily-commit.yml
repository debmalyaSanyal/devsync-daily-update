name: Daily Repository Updates

on:
  schedule:
    # 9:00 AM, 1:00 PM, 5:00 PM and 9:00 PM IST
    - cron: "30 3,7,11,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record daily update
        run: |
          mkdir -p daily-logs

          DATE=$(date -u +"%Y-%m-%d")
          TIME=$(date -u +"%H:%M:%S UTC")
          FILE="daily-logs/${DATE}.md"

          if [ ! -f "$FILE" ]; then
            echo "# Repository Activity - ${DATE}" > "$FILE"
            echo "" >> "$FILE"
          fi

          echo "- Automated repository maintenance at ${TIME}" >> "$FILE"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily-logs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: daily maintenance $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
